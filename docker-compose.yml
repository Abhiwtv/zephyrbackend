version: '3.8'

services:
  pc-1:
    build: 
      context: .
      dockerfile: Dockerfile.node
    container_name: pc-1
    cap_add:
      - NET_ADMIN
    networks:
      br-zephyr:
        ipv4_address: 172.28.0.12

  pc-2:
    build: 
      context: .
      dockerfile: Dockerfile.node
    container_name: pc-2
    cap_add:
      - NET_ADMIN
    networks:
      br-zephyr:
        ipv4_address: 172.28.0.13

  pc-3:
    build: 
      context: .
      dockerfile: Dockerfile.node
    container_name: pc-3
    cap_add:
      - NET_ADMIN
    networks:
