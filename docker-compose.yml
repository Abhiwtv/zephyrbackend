        ipv4_address: 172.28.0.14

  pc-4:
    build: 
      context: .
      dockerfile: Dockerfile.node
    container_name: pc-4
    cap_add:
      - NET_ADMIN
    networks:
      br-zephyr:
        ipv4_address: 172.28.0.15

  pc-5:
    build: 
