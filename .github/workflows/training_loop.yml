name: Zephyr Autonomous Training Loop

on:
  workflow_dispatch:

concurrency:
  group: zephyr-training-loop
  cancel-in-progress: false

jobs:
  run-gym:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Curriculum
        env:
          FORCE_COLOR: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/run_learning.py

      - name: Commit & Sync Training Telemetry
        run: |
          git config --global user.name "Zephyr Autonomous Bot"
          git config --global user.email "zephyr-bot@internal.soc"

          # Stage only learning outcomes and run telemetry
          git add data/dpo_dataset/preferences.jsonl
          git add data/training_runs/

          if git diff --staged --quiet; then
            echo "No state modifications detected. Skipping commit."
          else
            git commit -m "chore(autonomous-learning): update DPO preferences and incident rollouts [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi